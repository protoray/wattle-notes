name: Configured Linux and Windows packages

# Maintainer-triggered packaging only; PR checks never receive OAuth parameters.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    if: github.repository == 'protoray/wattle-notes' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            executable: wattle-notes
            platform: linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            executable: wattle-notes.exe
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Require Google Desktop client configuration
        run: npm run desktop:check-config
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - run: npm run check:security
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run check:desktop
      - name: Build configured platform installers
        run: npm run desktop:release -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Verify compiled Google configuration before upload
        run: npm run desktop:verify-google -- src-tauri/target/${{ matrix.target }}/release/${{ matrix.executable }}
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: wattle-notes-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
